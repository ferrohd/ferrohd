name: Website Build

on:
  pull_request:
      branches: [ master, main ]
      paths:
          - 'website/**'

jobs:
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: ☑️ Check
        working-directory: website
        run: zola check

      - name: 🔨 Build
        working-directory: website
        run: zola build
